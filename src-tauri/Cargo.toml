[package]
name = "floating-todo"
version = "0.1.0"
description = "一个常驻桌面、快捷记录的本地优先 Todo"
authors = ["Floating Todo"]
edition = "2021"
rust-version = "1.76"

[build-dependencies]
tauri-build = { version = "=1.5.6", features = [] }

[dependencies]
tauri = { version = "=1.8.3", features = ["dialog-open", "dialog-save", "global-shortcut-all", "macos-private-api", "path-all", "system-tray", "window-close", "window-hide", "window-set-always-on-top", "window-set-focus", "window-set-ignore-cursor-events", "window-set-position", "window-set-resizable", "window-set-size", "window-show", "window-start-dragging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
single-instance = "0.3.3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24.1"
objc = "0.2.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
